services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: normnetwork
      POSTGRES_PASSWORD: normnetwork
      POSTGRES_DB: normnetwork
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normnetwork -d normnetwork"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
